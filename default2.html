<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <title>Calendário Desportivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="container shadow-box">
    <h1 class="mb-4">📅 Calendário Desportivo</h1>

  <!-- Botão para mostrar filtros em md e abaixo -->
  <button class="btn btn-primary d-lg-none mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#filtrosCollapse">
    Mostrar Filtros
  </button>

  <!-- Filtros colapsáveis -->
  <div class="collapse d-lg-block" id="filtrosCollapse">
    <div class="row g-3 mb-4">
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-3">
        <label for="desportoSelect" class="form-label">Desporto</label>
        <select id="desportoSelect" class="form-select" onchange="atualizarEscaloes()"></select>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-3">
        <label for="escalaoSelect" class="form-label">Escalão</label>
        <select id="escalaoSelect" class="form-select" onchange="atualizarSeries()"></select>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-3">
        <label for="serieSelect" class="form-label">Série</label>
        <select id="serieSelect" class="form-select" onchange="atualizarJornadas()"></select>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-3">
        <label for="jornadaSelect" class="form-label">Jornada</label>
        <select id="jornadaSelect" class="form-select" onchange="atualizarCalendario()"></select>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-3">
	    <label for="equipaDestaqueSelect" class="form-label">Destacar Equipa</label>
	    <select id="equipaDestaqueSelect" class="form-select" onchange="atualizarCalendario()"></select>
	  </div>
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-3">
	    <label for="equipaDestaqueSelect" class="form-label">Esconder Isento</label>
		<select id="isentoSelect" class="form-select" onchange="atualizarCalendario()">
		    <option value="1">Sim</option>
		    <option value="0">Não</option>
		</select>
	  </div>
    </div>
  </div>

  <div id="jornada"></div>

  <script src="main.js"></script>
  <script>
    fetch('data.json').then(response => response.json()).then(json => {
		dados = json;
		atualizarDesportos();
		atualizarEscaloes();
		atualizarEquipasDestaque();
	});
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
